name: CI

on:
  push:
    branches: [main, develop, "feature/**", "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Well-known keys of the LOCAL Supabase stack started below (not secrets).
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      GOMENU_DEV_OUTBOX: "true"
      # Test-only key (not a secret) and the deterministic AI / domain stand-ins.
      GOMENU_SESSION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
      GOMENU_PAYMENTS_KEY: ICEiIyQlJicoKSorLC0uLzAxMjM0NTY3ODk6Ozw9Pj8=
      GOMENU_AI_PROVIDER: fake
      CRON_SECRET: ci-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: pnpm lint && pnpm typecheck

      - name: Start local Supabase (applies every migration + dev seed)
        run: pnpm exec supabase start -x studio,imgproxy,vector,logflare,supavisor,postgres-meta,edge-runtime,mailpit

      - name: Database tests (pgTAP — RLS, tenant isolation, New Staff zero access)
        run: pnpm test:db

      - name: Generated types are up to date
        run: |
          pnpm exec supabase gen types typescript --local > /tmp/types.ts
          diff -q /tmp/types.ts apps/web/lib/database.types.ts

      - name: API integration tests (Auth, PostgREST, Storage, Realtime)
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: End-to-end tests (Playwright)
        run: |
          pnpm --filter @gomenu/web exec playwright install --with-deps chromium
          pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
